<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Multiplayer Parkour - Main Menu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }
        /* Asosiy Menyu dizayni */
        #menuContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }
        .menu-box {
            background: #222530;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        h1 { margin-bottom: 20px; color: #61dafb; font-size: 24px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            box-sizing: border-box;
        }
        input { background: #333842; color: white; text-align: center; }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #45a049; }
        .btn-blue { background: #2196F3; }
        .btn-blue:hover { background: #0b7dda; }

        /* O'yin ichidagi UI */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 18px;
            border-radius: 8px;
            z-index: 10;
            display: none;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: none;
        }
    </style>
    <!-- Three.js va PeerJS kutubxonalari -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- ASOSIY MENYU -->
    <div id="menuContainer">
        <div class="menu-box">
            <h1>3D Parkour Multiplayer</h1>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">Zinapoyalardan pastga va yuqoriga harakatlanish</p>
            
            <button class="btn-blue" onclick="createRoom()">Xona Yaratish (Host)</button>
            <p id="myIdDisplay" style="font-size: 12px; color: #4CAF50; margin: 5px 0;"></p>
            
            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
            
            <input type="text" id="peerIdInput" placeholder="Do'stning Xona ID si">
            <button onclick="joinRoom()">Xonaga Qo'shilish</button>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="ui">
        <p>Holat: <span id="connectionStatus" style="color: #ff4757;">Kutilyapti...</span></p>
        <p>Balandlik: <span id="heightScore">0</span>m</p>
        <p style="font-size: 12px; color: #ccc; margin-top: 5px;">W, A, S, D - Yurish | Space - Sakrash</p>
    </div>

    <script>
        let scene, camera, renderer, player, peer, conn;
        let otherPlayers = {};
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocityY = 0, canJump = false;
        let isConnected = false;
        let gameStarted = false;

        const clock = new THREE.Clock();

        // PeerJS server sozlamalari (Ulanish xatolarining oldini olish uchun)
        function createPeerInstance(onOpenCallback) {
            // PeerJS ochiq serveriga aniq parametrlar bilan ulanamiz
            const p = new Peer({
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                path: '/'
            });

            p.on('error', (err) => {
                console.error("PeerJS xatosi:", err);
                alert("Serverga ulanishda xatolik yuz berdi: " + err.type + "\nIltimos, internetni tekshiring yoki sahifani yangilang.");
            });

            if (onOpenCallback) {
                p.on('open', onOpenCallback);
            }
            return p;
        }

        // Host (Xona yaratish)
        function initPeerForHost() {
            peer = createPeerInstance((id) => {
                document.getElementById('myIdDisplay').innerText = "Sizning Xona ID: " + id;
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnection();
                startGame();
            });
        }

        function createRoom() {
            document.querySelector('.btn-blue').innerText = "Xona yaratilmoqda...";
            initPeerForHost();
        }

        // Client (Xonaga qo'shilish)
        function joinRoom() {
            const peerId = document.getElementById('peerIdInput').value.trim();
            if (!peerId) return alert('Iltimos xona ID raqamini kiriting!');
            
            peer = createPeerInstance(() => {
                conn = peer.connect(peerId);
                setupConnection();
                startGame();
            });
        }

        function setupConnection() {
            isConnected = true;
            document.getElementById('connectionStatus').innerText = "Ulandi! 🟢";
            document.getElementById('connectionStatus').style.color = "#4CAF50";

            conn.on('data', (data) => {
                if (!otherPlayers[data.id]) {
                    const oGeo = new THREE.BoxGeometry(1, 2, 1);
                    const oMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff });
                    otherPlayers[data.id] = new THREE.Mesh(oGeo, oMat);
                    scene.add(otherPlayers[data.id]);
                }
                otherPlayers[data.id].position.set(data.x, data.y, data.z);
            });
        }

        function startGame() {
            gameStarted = true;
            document.getElementById('menuContainer').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            
            init3D();
            animate();
            document.body.requestPointerLock();
        }

        // 3D O'yin Muhiti
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Yorug'lik
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(20, 50, 20);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x505050));

            // O'yinchi (Siz)
            const playerGeo = new THREE.BoxGeometry(1, 2, 1);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0xff4757 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 15, 0);
            scene.add(player);

            createStairsAndPlatforms();
            setupControls();
            window.addEventListener('resize', onWindowResize);
        }

        function createStairsAndPlatforms() {
            const mat1 = new THREE.MeshStandardMaterial({ color: 0x0fa36d });
            const mat2 = new THREE.MeshStandardMaterial({ color: 0xffaa00 });

            let currentX = 0, currentY = 12, currentZ = 0;
            
            for (let i = 0; i < 50; i++) {
                const plat = new THREE.Mesh(
                    new THREE.BoxGeometry(5, 0.8, 5), 
                    i % 2 === 0 ? mat1 : mat2
                );
                
                plat.position.set(currentX, currentY, currentZ);
                scene.add(plat);

                currentY -= 1.5;
                if (i % 2 === 0) {
                    currentX += 4;
                } else {
                    currentZ -= 4;
                }
            }
        }

        function setupControls() {
            let euler = new THREE.Euler(0, 0, 0, 'YXZ');
            document.body.addEventListener('click', () => {
                if(gameStarted) document.body.requestPointerLock();
            });

            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement === document.body) {
                    const movementX = event.movementX || event.mozMovementX || 0;
                    const movementY = event.movementY || event.mozMovementY || 0;

                    euler.setFromQuaternion(camera.quaternion);
                    euler.y -= movementX * 0.002;
                    euler.x -= movementY * 0.002;
                    euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'Space' && canJump) {
                    velocityY = 0.12;
                    canJump = false;
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!gameStarted) return;

            const delta = clock.getDelta();

            const speed = 5.0 * delta;
            let moveDir = new THREE.Vector3();
            if (moveForward) moveDir.z -= 1;
            if (moveBackward) moveDir.z += 1;
            if (moveLeft) moveDir.x -= 1;
            if (moveRight) moveDir.x += 1;
            moveDir.normalize();
            moveDir.applyQuaternion(camera.quaternion);
            moveDir.y = 0;

            player.position.addScaledVector(moveDir, speed);

            velocityY -= 0.005;
            player.position.y += velocityY;

            if (player.position.y <= -20) {
                player.position.set(0, 15, 0);
                velocityY = 0;
            } else if (player.position.y <= 1.5 && player.position.y > 0) {
                canJump = true;
            }

            camera.position.copy(player.position);
            camera.position.y += 1.6;

            document.getElementById('heightScore').innerText = Math.floor(player.position.y);

            if (isConnected && conn && conn.open) {
                conn.send({
                    id: peer.id,
                    x: player.position.x,
                    y: player.position.y,
                    z: player.position.z
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (!gameStarted) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
